name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so the Medium feed, the repo list and the telemetry refresh
  # even on days the agent has nothing to commit. /writing says it works so.
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the changelog page renders git log
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generated into the deploy artifact rather than committed. The daily
      # Pages rebuild keeps the rolling contribution year current, while a
      # local checkout can retain the last generated copy as a fallback.
      - name: Refresh GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ElliotJLT
          outputs: |
            public/github-snake.svg?color_snake=#cc5600&color_dots=#e9e0ca,#dce7d7,#b6cdaa,#7fa382,#3f6b47&color_background=#faf3e2&color_dot_border=#00000010
            public/github-snake-dark.svg?color_snake=#d9a441&color_dots=#1b2523,#193129,#2d4f3a,#4d775d,#7bb389&color_background=#0d1716&color_dot_border=#ffffff10
      - name: Respect reduced-motion preferences in the generated SVGs
        run: node scripts/prepare-github-snake.mjs
      - run: npm run build
        env:
          BASE_PATH: /elliot-os
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
