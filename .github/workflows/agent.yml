name: Agent — refresh /now

on:
  schedule:
    # Daily. A weekly cadence left the shipping log up to six days behind a
    # heavy day of shipping, which is the opposite of the point. The run is
    # deterministic unless ANTHROPIC_API_KEY is set, so daily costs nothing.
    #
    # It exits without committing when there is nothing new to say. That was
    # claimed here for a month before it was true: the log's header carries the
    # run date, so the file changed every day regardless, and the loop committed
    # 26 days running — twice publishing "0 commits across 0 repos" under a
    # commit message announcing a refresh. agent-now.mjs now compares the
    # substance below the header and exits early when it matches.
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/agent-now.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Without it the agent writes the deterministic log only
          # and records $0. With it, a Claude summary is added and the real
          # token cost lands in data/spend.json.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit as the agent
        run: |
          git config user.name "elliot-os agent"
          git config user.email "agent@elliot-os.invalid"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # agent-now.mjs updates all three. Omitting loops.json here used to
          # discard the run record while still publishing the digest, leaving
          # /loops stale even though the workflow had succeeded.
          git add content/now.md data/spend.json data/loops.json
          git commit -m "agent: refresh /now shipping log + spend telemetry"
          git push
          gh workflow run "Deploy to GitHub Pages"
        env:
          GH_TOKEN: ${{ github.token }}
